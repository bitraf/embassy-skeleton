[package]
name = "esp32c3"
version = "0.1.0"
edition = "2024"

[dependencies]
esp-hal = { version = "1.0.0", features = ["log-04", "unstable", "esp32c3"] }
esp-radio = { version = "0.17.0", features = ["log-04", "wifi", "esp32c3"]}
esp-alloc = "0.9.0"
esp-rtos = { version = "0.2.0", features = ["esp-radio", "embassy", "log-04", "esp32c3"]}
embassy-executor = { version = "0.9.0"}
embassy-time = "0.5.0"
embassy-net = { version = "0.7.0", features = ["dhcpv4", "medium-ethernet", "tcp", "udp"] }
esp-backtrace = { version = "0.18.1", features = ["panic-handler", "println", "esp32c3"] }
esp-println = { version = "0.16.1", features = ["log-04", "esp32c3"] }
esp-bootloader-esp-idf = { version = "0.4.0", features = ["esp32c3"] }
embedded-io-async = "0.6.1"
ssd1306 = { git = "https://github.com/rust-embedded-community/ssd1306.git", rev = "79cb629fdb2b27820fb096b360cec51c73ff5f14", features = ["async"]}
display-interface = "0.5.0"
static_cell = "2.1.0"

[build-dependencies]
esp-config = { version = "0.6.1", features = ["build"]}
cfg-if = "1.0.0"
esp-metadata-generated = { version = "0.3.0", features = ["build-script", "esp32c3"] }
serde = { version = "1.0.219", default-features = false, features = ["derive"] }

[features]
default = ["esp32c3"]
esp32c3 = []

[profile.release]
opt-level = 3
debug = true
debug-assertions = true
lto = "fat"
codegen-units = 1

[[bin]]
name = "esp32c3"
test = false
bench = false

[profile.dev.package.esp-radio]
opt-level = 3
